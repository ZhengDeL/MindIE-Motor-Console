name: qinghuan-observability

x-isolation: &isolation
  runtime: runc
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks: [observability]

services:
  prometheus:
    <<: *isolation
    image: ${QH_PROMETHEUS_IMAGE:?Use a verified official arm64 image ID}
    pull_policy: never
    user: "65534:65534"
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    mem_reservation: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --query.max-concurrency=4
      - --query.max-samples=1000000
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ${QH_OBSERVABILITY_ROOT:?Use an absolute independent directory}/config/prometheus:/etc/prometheus:ro
      - ${QH_OBSERVABILITY_ROOT}/data/prometheus:/prometheus
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m,uid=65534,gid=65534"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    <<: *isolation
    image: ${QH_GRAFANA_IMAGE:?Use a verified official arm64 image ID}
    pull_policy: never
    user: "472:472"
    cpus: 0.8
    mem_limit: 768m
    memswap_limit: 768m
    mem_reservation: 256m
    environment:
      GF_SERVER_ROOT_URL: ${QH_GRAFANA_ORIGIN:?Use the exact HTTPS origin}/
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/qh-secrets/admin-password
      GF_SECURITY_SECRET_KEY__FILE: /run/qh-secrets/secret-key
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 30s
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
    volumes:
      - ${QH_OBSERVABILITY_ROOT}/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${QH_OBSERVABILITY_ROOT}/config/grafana/dashboards:/opt/qinghuan/dashboards:ro
      - ${QH_OBSERVABILITY_ROOT}/private/grafana:/run/qh-secrets:ro
      - ${QH_OBSERVABILITY_ROOT}/data/grafana:/var/lib/grafana
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,uid=472,gid=472"]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  ingress:
    <<: *isolation
    image: ${QH_NGINX_IMAGE:?Use a verified official arm64 image ID}
    pull_policy: never
    user: "101:101"
    cpus: 0.2
    mem_limit: 128m
    memswap_limit: 128m
    mem_reservation: 32m
    entrypoint: [nginx, -g, "daemon off;"]
    ports:
      - ${QH_OBSERVABILITY_BIND_IP:-127.0.0.1}:${QH_OBSERVABILITY_PORT:-19444}:8443
    volumes:
      - ${QH_OBSERVABILITY_ROOT}/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${QH_OBSERVABILITY_ROOT}/private/tls:/run/qh-tls:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101"]
    depends_on:
      grafana:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  observability:
    driver: bridge
