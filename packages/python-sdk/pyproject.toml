[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-console-sdk"
version = "1.0.0"
description = "Independent typed public contracts for Motor Console providers"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[tool.setuptools]
packages = ["motor_console_sdk"]

[tool.setuptools.package-data]
motor_console_sdk = ["py.typed"]
